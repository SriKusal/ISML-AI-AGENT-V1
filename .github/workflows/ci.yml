name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Unit & Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov slowapi

      - name: Run unit and regression tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_integration.py \
            --cov=app \
            --cov=database \
            --cov-report=term-missing \
            --cov-config=.coveragerc \
            -q
        env:
          # No real credentials needed for unit tests — all external calls mocked
          GEMINI_API_KEY: "test-key-not-used"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/isml_test"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  integration:
    name: Integration Tests (optional)
    runs-on: ubuntu-latest
    # Only run when explicitly triggered (not on every PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: isml_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov slowapi

      - name: Run integration tests
        run: |
          python -m pytest tests/test_integration.py -v
        env:
          INTEGRATION_DB: "true"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/isml_test"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
